# ABOUTME: Local Apache 2.4 + PHP 8.2 config that mirrors production closely enough to test .htaccess.
# ABOUTME: Local verification only — never deployed. Launched by tests/serve-apache.ps1.
#
# Paths come in as Defines from serve-apache.ps1 (httpd -C "Define ..."), so nothing
# here is machine-specific:
#   PHP_DIR    directory holding php8apache2_4.dll and php.ini
#   SITE_ROOT  the built site (dist/) — the document root
#   STATE_DIR  writable form state, deliberately OUTSIDE the document root
#   LOG_DIR    error/access logs for this run
#   PORT       listening port
# ServerRoot arrives as -d, so `modules/...` and `conf/mime.types` resolve.

Listen ${PORT}

# UseCanonicalName On makes Apache build redirect Locations from ServerName rather than
# the (spoofed, see below) Host header, so a relative RewriteRule target comes back as
# localhost and the chain stays on this server instead of walking off to production.
ServerName localhost:${PORT}
UseCanonicalName On

# mpm_winnt is compiled into httpd.exe on Windows (`httpd -l`), so it is not loaded here.
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule env_module modules/mod_env.so
# .htaccess uses SetEnvIfNoCase for the old-browser gzip exclusions.
LoadModule setenvif_module modules/mod_setenvif.so

# The four .htaccess depends on. Without them its <IfModule> guards match nothing and
# the redirect, header, compression and caching blocks silently do nothing.
# mod_filter is what makes AddOutputFilterByType work; mod_deflate alone is not enough.
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule headers_module modules/mod_headers.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule filter_module modules/mod_filter.so
LoadModule expires_module modules/mod_expires.so

LoadModule php_module "${PHP_DIR}/php8apache2_4.dll"
PHPIniDir "${PHP_DIR}"
AddHandler application/x-httpd-php .php
DirectoryIndex index.html index.php

DocumentRoot "${SITE_ROOT}"

# AllowOverride All is the single setting that decides whether .htaccess is read at all
# — and the open question for CASA IT is whether their server allows the same.
# See docs/hosting-questions.md.
<Directory "${SITE_ROOT}">
    AllowOverride All
    Options -Indexes
    Require all granted
</Directory>

# Picked up by public/api/config.php, which prefers it over the production path.
SetEnv JMCC_FORM_STATE "${STATE_DIR}"

# Present as the canonical origin so section 1 of .htaccess stays inert. Without this,
# rule A sees Host: localhost, 301s every request to https://www.wecompete.ca, and
# nothing below section 1 is ever reached — every path assertion would fail against the
# live site instead of this build. `early` runs at post-read-request, before mod_rewrite
# reads the headers; it is a main-config-only flag, which is why this cannot live in
# .htaccess. X-Forwarded-Proto keeps rule B (http -> https) inert for the same reason.
# The canonical-host rules themselves are therefore NOT tested here — check-redirects.ps1
# skips them unless pointed at a real wecompete.ca URL.
RequestHeader set Host "www.wecompete.ca" early
RequestHeader set X-Forwarded-Proto "https" early

PidFile "${LOG_DIR}/httpd.pid"
ErrorLog "${LOG_DIR}/error.log"
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog "${LOG_DIR}/access.log" common

# ABOUTME: Serves the built site through real Apache so .htaccess can be verified locally.
# ABOUTME: Local only. Run `npm run preview:apache`, then tests/check-redirects.ps1.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.local
    ports:
      - "8080:80"
    volumes:
      # The built site, read-only — the container must never be able to alter it.
      - ./dist:/var/www/html:ro
      # Writable form state, mounted OUTSIDE the document root, exactly as production
      # keeps it outside the rsync target.
      - ./.docker-form-state:/var/form-state
    environment:
      # Picked up by public/api/config.php, which prefers this over the production path.
      JMCC_FORM_STATE: /var/form-state
